<html>

<head>
	<meta http-equiv="content-type" content="text/html;charset=utf-8">
	<title>d3.js gauges</title>

	<style>
		body {
			font: 10px arial;
		}
		.gauge {
			position: absolute;
			left: 20%;
		}
	</style>

	<script type="text/javascript" src="http://mbostock.github.com/d3/d3.js"></script>
	<script type="text/javascript" src="gauge.js"></script>
	<script>
		var currentScore = 0;
		const webSocket = new WebSocket("ws://localhost:3000");

		webSocket.onopen = () => {
			console.log('open connection')
		}

		webSocket.onclose = () => {
			console.log('close connection')
		}

		webSocket.onmessage = function (e) {
			if (e.data) {
				const dataReceived = JSON.parse(e.data);
				const { errorTypes, objectClasses, startingScore } = dataReceived;
				if (startingScore) {
					currentScore = startingScore;
					updateGauges(currentScore);
				}
				if (currentScore < 500) {
					if (errorTypes) {
						let scoreDiff = 0;
						for (let i = 0; i < errorTypes.length; i++) {
							const errorType = errorTypes[i];
							if (errorType === 'red') {
								scoreDiff -= 5;
							} else if (errorType === 'yellow') {
								scoreDiff -= 3;
							}
						}
						
						currentScore += scoreDiff;
					}

					updateGauges(currentScore);
				}

			}
		}


		var gauges = [];

		function createGauge(name, label, min, max) {
			var config =
			{
				size: 360,
				label: label,
				min: undefined != min ? min : 0,
				max: undefined != max ? max : 100,
				minorTicks: 10
			}

			var range = config.max - config.min;
			config.redZones = [{ from: config.min + range * 0, to: config.min + range * 0.15 }];
			config.yellowZones = [{ from: config.min + range * 0.15, to: config.min + range * 0.40 }];
			config.greenZones = [{ from: config.min + range * 0.40, to: config.max }];

			gauges[name] = new Gauge(name + "GaugeContainer", config);
			gauges[name].render();
		}

		function createGauges() {
			createGauge("score", "Score");
		}

		function updateGauges(score) {
			for (var key in gauges) {
				var value = score;
				gauges[key].redraw(value);
			}
		}

		function getRandomValue(gauge) {
			var overflow = 0; //10;
			return gauge.config.min - overflow + (gauge.config.max - gauge.config.min + overflow * 2) * Math.random();
		}

		function initialize() {
			createGauges();
		}

	</script>


</head>

<body onload="initialize()">
	<span id="scoreGaugeContainer"></span>
</body>

</html>
